appId: com.pedropasin.atelie
productName: Ateliê
copyright: © Pedro Pasin

directories:
  output: release
  buildResources: build

# Só o essencial vai para o pacote: o bundle Electron, a UI compilada e o
# package.json (para "main" + versão). O motor já está EMBUTIDO no main.cjs pelo
# esbuild, então node_modules não precisa ser empacotado.
files:
  - dist-electron/**
  - ui/dist/**
  - package.json

# O servidor Fastify serve ui/dist do disco (createReadStream/@fastify/static).
# Ler estáticos de dentro do asar é problemático → desligamos o asar no MVP.
# Custo: arquivos ficam soltos em resources/app/ (aceitável para app interno).
asar: false

# O wrapper gpt-image-2 VAI no pacote (o usuário final não instala nada à mão).
# Copiamos a árvore npm preservando o layout `node_modules/` porque o `index.cjs`
# do pacote acha o binário da plataforma via `require.resolve` — de dentro de
# `wrapper/node_modules/gpt-image-2-skill/` ele sobe um nível e encontra o pacote
# de plataforma ao lado. `src/config.ts` procura exatamente este caminho sob
# `process.resourcesPath`.
#
# O pacote de plataforma difere por SO, então cada bloco (win/mac/linux) declara o
# seu. Só as CLIs `codex` e `claude` continuam sendo BYO — elas carregam o login
# do usuário e não podem ser embutidas (ver o wizard de 1ª execução).
extraResources:
  - from: node_modules/gpt-image-2-skill
    to: wrapper/node_modules/gpt-image-2-skill
  - from: scripts/remover_fundo.py
    to: fundo/remover_fundo.py

win:
  target:
    - nsis
  extraResources:
    - from: node_modules/gpt-image-2-skill
      to: wrapper/node_modules/gpt-image-2-skill
    - from: node_modules/gpt-image-2-skill-windows-x64-msvc
      to: wrapper/node_modules/gpt-image-2-skill-windows-x64-msvc
    - from: scripts/remover_fundo.py
      to: fundo/remover_fundo.py
    # Codex CLI: entra SÓ para o login ChatGPT do wizard (src/lib/codexCli.ts).
    # O `codex-code-mode-host` (~46MB) é do modo de execução de código, que o
    # Ateliê nunca chama — fica de fora para não inchar o instalador.
    - from: node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc
      to: codex
      filter:
        - '**/*'
        - '!bin/codex-code-mode-host*'

mac:
  target:
    - dmg
  category: public.app-category.graphics-design
  extraResources:
    - from: node_modules/gpt-image-2-skill
      to: wrapper/node_modules/gpt-image-2-skill
    - from: node_modules/gpt-image-2-skill-darwin-arm64
      to: wrapper/node_modules/gpt-image-2-skill-darwin-arm64
    - from: scripts/remover_fundo.py
      to: fundo/remover_fundo.py
    - from: node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin
      to: codex
      filter:
        - '**/*'
        - '!bin/codex-code-mode-host*'

linux:
  target:
    - AppImage
  category: Graphics
  extraResources:
    - from: node_modules/gpt-image-2-skill
      to: wrapper/node_modules/gpt-image-2-skill
    - from: node_modules/gpt-image-2-skill-linux-x64-gnu
      to: wrapper/node_modules/gpt-image-2-skill-linux-x64-gnu
    - from: scripts/remover_fundo.py
      to: fundo/remover_fundo.py
    - from: node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl
      to: codex
      filter:
        - '**/*'
        - '!bin/codex-code-mode-host*'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: pedropasinn
  repo: atelie
